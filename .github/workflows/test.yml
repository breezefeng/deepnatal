# The package claims results are verified three independent ways.
# This runs that verification on every push, so the claim is checkable
# by anyone rather than asserted in a README.
name: test
on:
  push: { branches: [main] }
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20.x', '22.x', '24.x']
    steps:
      # Action runtime version. Unrelated to matrix.node below, which is the
      # Node the package is actually tested against — that range is pinned to
      # the engines field in package.json and should not be raised to match.
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run build
      # Timezone correctness is the whole point; run the suite from a
      # non-UTC host clock so an accidental reliance on the local zone shows up.
      - run: TZ=America/New_York npm run test:dist
